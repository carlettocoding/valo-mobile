name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================
  # 🤖 COMPILACIÓN ANDROID (APK)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar scaffolding nativo de plataformas
        run: flutter create --org com.carlitos --project-name valo_mobile .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: valo-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ==========================================
  # 🍏 COMPILACIÓN iOS (IPA)
  # ==========================================
  build-ios:
    name: Build iOS IPA (Unsigned / Sideloading)
    runs-on: macos-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generar scaffolding nativo de plataformas
        run: flutter create --org com.carlitos --project-name valo_mobile .

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar iOS IPA (sin firmar)
        run: flutter build ipa --release --no-codesign

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: valo-ios-release
          path: build/ios/ipa/*.ipa
          retention-days: 14
