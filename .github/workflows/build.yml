name: Build Mobile Apps (Android & iOS)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Tipo de compilación'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - 'v*'

jobs:
  # ==========================================
  # 🤖 COMPILACIÓN ANDROID (APK)
  # ==========================================
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar APK
        run: flutter build apk --release

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: valo-android-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  # ==========================================
  # 🍏 COMPILACIÓN iOS (IPA CON WIDGETS)
  # ==========================================
  build-ios:
    name: Build iOS IPA (Unsigned / Sideloading)
    runs-on: macos-14
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Compilar iOS Bundle (sin firmar)
        run: flutter build ios --release --no-codesign

      - name: Empaquetar como archivo .IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r Valo-iOS-Release.ipa Payload
          rm -rf Payload

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: valo-ios-release
          path: Valo-iOS-Release.ipa
          retention-days: 14

